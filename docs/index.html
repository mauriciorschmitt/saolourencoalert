<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitoramento Ambiental — Represa São Lourenço</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

<style>
:root{
  --bg:#f4f7f8;
  --card:#fff;
  --text:#17313a;
  --muted:#6b7d84;
  --accent:#176b62;
  --line:#dfe8ea;
  --ok:#237a4b;
  --warn:#a66b00;
  --alert:#a33a36;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
}

.wrap{
  max-width:1180px;
  margin:auto;
  padding:28px 18px 50px;
}

.hero{
  background:linear-gradient(135deg,#123d45,#176b62);
  color:#fff;
  border-radius:24px;
  padding:30px;
  box-shadow:0 12px 35px #123d4522;
}

.hero h1{
  margin:0 0 8px;
  font-size:clamp(25px,4vw,42px);
}

.hero p{
  margin:0;
  color:#dcefee;
}

.badge{
  display:inline-block;
  margin-top:18px;
  padding:8px 13px;
  border-radius:999px;
  background:#ffffff20;
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:1.1fr 2fr;
  gap:18px;
  margin-top:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 18px #17313a0b;
}

.status{
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
  min-height:205px;
}

.status .big{
  font-size:34px;
  font-weight:800;
  margin:8px 0;
}

.status p{
  color:var(--muted);
  margin:0;
}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.metric{
  border:1px solid var(--line);
  border-radius:15px;
  padding:16px;
}

.metric small{
  color:var(--muted);
}

.metric strong{
  display:block;
  font-size:27px;
  margin-top:7px;
}

.section{
  margin-top:18px;
}

.section h2{
  font-size:20px;
  margin:0 0 13px;
}

.images{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
}

.images img{
  width:100%;
  border-radius:14px;
  border:1px solid var(--line);
}

.meta{
  display:flex;
  gap:18px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:13px;
  margin-top:10px;
}

.chartbox{
  height:350px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}

.controls button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:999px;
  padding:8px 12px;
  cursor:pointer;
}

.controls button.active{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
}

#map{
  height:360px;
  border-radius:15px;
  overflow:hidden;
}

.foot{
  color:var(--muted);
  font-size:12px;
  text-align:center;
  margin-top:25px;
}

.loading{
  color:var(--muted);
}

.legend{
  margin-top:14px;
  border-top:1px solid var(--line);
  padding-top:12px;
}

.legend summary{
  cursor:pointer;
  color:var(--accent);
  font-size:13px;
  font-weight:600;
  list-style:none;
}

.legend summary::-webkit-details-marker{
  display:none;
}

.legend summary::before{
  content:"▸ ";
  display:inline-block;
  transition:transform .15s;
}

.legend[open] summary::before{
  transform:rotate(90deg);
}

.legend dl{
  margin:12px 0 0;
  font-size:13px;
  color:var(--text);
}

.legend dt{
  font-weight:700;
  margin-top:10px;
}

.legend dt:first-child{
  margin-top:0;
}

.legend dd{
  margin:2px 0 0;
  color:var(--muted);
  line-height:1.5;
}

.scale{
  margin-top:12px;
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.scale-title{
  background:#f4f7f8;
  padding:9px 11px;
  font-size:12px;
  font-weight:700;
  color:var(--text);
}

.scale-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 11px;
  border-top:1px solid var(--line);
  font-size:12px;
}

.scale-value{
  min-width:78px;
  font-weight:700;
  color:var(--accent);
}

.scale-label{
  color:var(--muted);
}

.scale-row.attention{
  background:#fff8e8;
}

.scale-row.alert{
  background:#fff1f0;
}

.scale-row.attention .scale-value{
  color:var(--warn);
}

.scale-row.alert .scale-value{
  color:var(--alert);
}

.scale-note{
  margin-top:10px;
  padding:10px 12px;
  border-left:3px solid var(--accent);
  background:#f4f7f8;
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  border-radius:0 8px 8px 0;
}

.guide-card{
  background:linear-gradient(135deg,#f7fbfa,#ffffff);
}

.guide-content{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.guide-content h2{
  margin:0 0 7px;
  font-size:18px;
}

.guide-content p{
  margin:0;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  max-width:720px;
}

.guide-button{
  flex-shrink:0;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:11px 17px;
  border-radius:999px;
  background:var(--accent);
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:.2s;
}

.guide-button:hover{
  transform:translateY(-1px);
  box-shadow:0 5px 15px #176b6230;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }

  .metrics{
    grid-template-columns:repeat(2,1fr);
  }

  .chartbox{
    height:280px;
  }
}

@media(max-width:600px){
  .guide-content{
    flex-direction:column;
    align-items:flex-start;
  }

  .guide-button{
    width:100%;
  }
}

@media(max-width:450px){
  .metrics{
    grid-template-columns:1fr 1fr;
  }

  .hero{
    padding:22px;
  }

  .wrap{
    padding:15px;
  }
}
</style>
</head>

<body>
<div class="wrap">

<section class="hero">
  <h1>🛰️ Monitoramento Ambiental</h1>
  <p>Represa São Lourenço · Mafra, Santa Catarina</p>
  <span class="badge">Atualização automática por imagens Sentinel-2</span>
</section>

<div id="app">
  <p class="loading">Carregando dados do monitoramento…</p>
</div>

<footer class="foot">
  Projeto de monitoramento remoto · Dados processados automaticamente · Sentinel-2 / Copernicus Data Space
</footer>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
let latest=null, historyData=[], chart=null;

const fmt=(v,d=3)=>
  Number.isFinite(Number(v))
    ?Number(v).toFixed(d).replace('.',',')
    :'—';

const statusClass=s=>
  s==='ALERTA'
    ?'alert'
    :s==='ATENÇÃO'
      ?'warn'
      :'ok';

async function load(){
  try{
    latest=await fetch('data/ultimo.json?'+Date.now()).then(r=>r.json());

    historyData=await fetch('data/historico.csv?'+Date.now())
      .then(r=>r.text())
      .then(parseCSV);

    render();
  }catch(e){
    document.getElementById('app').innerHTML=
      '<div class="card"><h2>Dados indisponíveis</h2><p>O dashboard ainda não recebeu uma execução do monitoramento.</p></div>';
  }
}

function parseCSV(t){
  let lines=t.trim().split(/\r?\n/);

  if(lines.length<2)return[];

  let h=lines[0].split(',');

  return lines.slice(1)
    .map(x=>{
      let v=x.split(',');
      return Object.fromEntries(h.map((k,i)=>[k,v[i]]));
    })
    .filter(x=>x.date);
}

function render(){
  const s=latest.status||'SEM DADOS';

  document.getElementById('app').innerHTML=`
  <div class="grid">
    <div class="card status">
      <small>STATUS ATUAL</small>

      <div class="big">
        ${s==='ALERTA'?'🔴':s==='ATENÇÃO'?'🟡':'🟢'} ${s}
      </div>

      <p>Imagem analisada: <b>${latest.date||'—'}</b></p>

      <div class="meta">
        <span>
          Atualizado:
          ${latest.updated_at
            ?new Date(latest.updated_at).toLocaleString('pt-BR')
            :'—'}
        </span>
      </div>
    </div>

    <div class="card">
      <h2>Indicadores da última imagem</h2>

      <div class="metrics">
        <div class="metric">
          <small>🌿 NDVI</small>
          <strong>${fmt(latest.ndvi)}</strong>
        </div>

        <div class="metric">
          <small>💧 NDWI</small>
          <strong>${fmt(latest.ndwi)}</strong>
        </div>

        <div class="metric">
          <small>🌱 NDMI</small>
          <strong>${fmt(latest.ndmi)}</strong>
        </div>

        <div class="metric">
          <small>📊 Z-score</small>
          <strong>${fmt(latest.zscore,2)}</strong>
        </div>
      </div>

      <div class="meta">
        <span>☁️ Nuvens: <b>${fmt(latest.cloud_pct,1)}%</b></span>
        <span>Pixels válidos: <b>${fmt(Number(latest.valid_fraction)*100,1)}%</b></span>
      </div>

      <details class="legend">
        <summary>O que significa cada indicador?</summary>

        <dl>
          <dt>🌿 NDVI — Índice de Vegetação por Diferença Normalizada</dt>
          <dd>
            Mede a quantidade de vegetação viva na superfície da água.
            Valores próximos de zero ou negativos indicam água aberta.
            Valores crescentes podem indicar presença de macrófitas.
          </dd>

          <dt>💧 NDWI — Índice de Água por Diferença Normalizada</dt>
          <dd>
            Mede a presença de água aberta na superfície.
            Valores mais altos ou positivos costumam indicar maior resposta associada à água,
            enquanto valores baixos podem indicar vegetação ou solo exposto.
          </dd>

          <dt>🌱 NDMI — Índice de Umidade por Diferença Normalizada</dt>
          <dd>
            Mede a resposta associada à umidade da cobertura de superfície.
            Ele complementa NDVI e NDWI na interpretação da cena.
          </dd>
        </dl>

        <div class="scale">
          <div class="scale-title">Como interpretar o NDMI</div>

          <div class="scale-row">
            <span class="scale-value">Mais positivo</span>
            <span class="scale-label">💧 Maior resposta associada à umidade</span>
          </div>

          <div class="scale-row">
            <span class="scale-value">Próximo de 0</span>
            <span class="scale-label">🌱 Condição intermediária</span>
          </div>

          <div class="scale-row">
            <span class="scale-value">Mais negativo</span>
            <span class="scale-label">🏜️ Menor resposta associada à umidade</span>
          </div>
        </div>

        <dl>
          <dt>📊 Z-score — Anomalia</dt>
          <dd>
            Indica quanto o NDVI observado está acima ou abaixo do comportamento histórico
            esperado para aquele período. Quanto maior o valor positivo, maior a diferença
            em relação ao padrão histórico.
          </dd>
        </dl>

        <div class="scale">
          <div class="scale-title">Escala do alerta estatístico</div>

          <div class="scale-row">
            <span class="scale-value">&lt; 1,5</span>
            <span class="scale-label">🟢 Comportamento dentro do padrão esperado</span>
          </div>

          <div class="scale-row attention">
            <span class="scale-value">1,5 – 2,0</span>
            <span class="scale-label">🟡 ATENÇÃO — alteração acima do padrão</span>
          </div>

          <div class="scale-row alert">
            <span class="scale-value">≥ 2,0</span>
            <span class="scale-label">🔴 ALERTA — anomalia estatística</span>
          </div>
        </div>

        <div class="scale-note">
          <b>Importante:</b> um alerta estatístico não significa automaticamente
          que existe uma infestação. Ele indica que o comportamento observado
          merece investigação.
        </div>
      </details>
    </div>
  </div>

  <section class="section card">
    <h2>🛰️ Imagem mais recente — RGB + NDVI + NDWI</h2>

    <div class="images">
      <img
        src="images/latest/panel.png?${Date.now()}"
        alt="Painel RGB, NDVI e NDWI">
    </div>

    <div class="meta">
      <span>Data: ${latest.date||'—'}</span>
      <span>${latest.cloud_note||''}</span>
    </div>
  </section>

  <section class="section card">
    <h2>📈 Série temporal</h2>

    <div class="controls">
      <button class="active" data-key="ndvi">NDVI</button>
      <button data-key="ndwi">NDWI</button>
      <button data-key="ndmi">NDMI</button>
      <button data-key="zscore">Z-score</button>
      <button data-key="cloud_pct">Nuvens</button>
    </div>

    <div class="chartbox">
      <canvas id="chart"></canvas>
    </div>
  </section>

  <section class="section card">
    <h2>🗺️ Área de estudo</h2>
    <div id="map"></div>
  </section>

  <section class="section card">
    <h2>📚 Como funciona</h2>

    <p>
      O sistema consulta imagens Sentinel-2 automaticamente, aplica a máscara de nuvens SCL
      e calcula NDVI, NDWI e NDMI sobre a área da Represa São Lourenço.
      O NDVI é comparado à climatologia mensal por Z-score.
    </p>

    <p>
      <b>Importante:</b> 10% de cobertura de nuvens é uma referência de qualidade,
      não um bloqueio. Mesmo com cobertura elevada, a imagem pode ser publicada
      quando houver pixels válidos para análise.
    </p>
  </section>

  <section class="section card guide-card">
    <div class="guide-content">
      <div>
        <h2>📖 Quer saber mais?</h2>

        <p>
          Consulte o guia completo para entender a metodologia,
          os índices, os critérios de alerta, as limitações dos dados
          e como interpretar os resultados deste monitoramento.
        </p>
      </div>

      <a
        class="guide-button"
        href="https://docs.google.com/document/d/1ewN47MxrFotTl96dtR5dKqtNZt4cP8jBaFofFWj2hm0/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer">
        📖 Guia completo
      </a>
    </div>
  </section>`;

  drawChart('ndvi');

  document.querySelectorAll('.controls button').forEach(b=>{
    b.onclick=()=>{
      document.querySelectorAll('.controls button')
        .forEach(x=>x.classList.remove('active'));

      b.classList.add('active');

      drawChart(b.dataset.key);
    };
  });

  drawMap();
}

function drawChart(key){
  if(chart)chart.destroy();

  let ctx=document.getElementById('chart');
  let labels=historyData.map(x=>x.date);
  let vals=historyData.map(x=>Number(x[key]));

  chart=new Chart(ctx,{
    type:'line',
    data:{
      labels,
      datasets:[
        {
          label:key.toUpperCase(),
          data:vals,
          tension:.25,
          fill:false
        }
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{
        legend:{
          display:false
        }
      },
      scales:{
        x:{
          ticks:{
            maxTicksLimit:10
          }
        },
        y:{
          beginAtZero:false
        }
      }
    }
  });
}

function drawMap(){
  const map=L.map('map').setView([-26.181,-49.892],14);

  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      attribution:'© OpenStreetMap'
    }
  ).addTo(map);

  fetch('data/roi.geojson')
    .then(r=>r.json())
    .then(g=>{
      let layer=L.geoJSON(g,{
        style:{
          weight:2,
          fillOpacity:.12
        }
      }).addTo(map);

      map.fitBounds(layer.getBounds(),{
        padding:[20,20]
      });
    });
}

load();
</script>
</body>
</html>
