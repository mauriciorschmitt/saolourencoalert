name: Testes

# Roda a cada push de código e em todo PR, inclusive nos do Dependabot: uma
# atualização de dependência só deve entrar se os testes passarem. Os
# commits de dados do monitoramento levam [skip ci] e não disparam isto.
# Nenhum teste usa a rede de verdade (tests/rede_simulada.py).

on:
  push:
    paths-ignore: ["docs/data/**", "docs/images/**", "data/campo.csv"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
