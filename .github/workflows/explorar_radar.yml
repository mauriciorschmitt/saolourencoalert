name: Testar radar Sentinel-1 (temporário)

# Só roda em push para a branch explora-radar. Não grava nada no repositório
# nem envia avisos: roda o pipeline completo e devolve docs/data como
# artefato. Será removido antes do merge.
on:
  push:
    branches: [explora-radar]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SH_CLIENT_ID:     ${{ secrets.SH_CLIENT_ID }}
      SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}
      NOTIFICAR: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Série histórica do radar
        run: python -m src.radar --desde 2016-07-19
      - name: Execução agendada (radar na janela de 30 dias, sobre a série)
        run: python -m src.radar
      - name: Macrófitas e montagem do aviso (sem enviar)
        run: python monitor_ndvi.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-data
          path: docs/data
          retention-days: 7
