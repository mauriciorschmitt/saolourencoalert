name: Testar recalibração (temporário)

# Só roda em push para a branch recalibracao. Não grava nada no repositório
# nem envia avisos: reconstrói as séries com a configuração nova e devolve
# docs/data como artefato. Será removido antes do merge.
on:
  push:
    branches: [recalibracao]

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SH_CLIENT_ID:     ${{ secrets.SH_CLIENT_ID }}
      SH_CLIENT_SECRET: ${{ secrets.SH_CLIENT_SECRET }}
      NOTIFICAR: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Qualidade da água — série completa, classificação nova
        run: python -m src.monitor --desde 2016-07-19
      - name: Macrófitas — série completa com recuo
        run: python backfill_historico.py --since 2016-07-19 --substituir
      - name: Macrófitas — execução normal (ultimo.json)
        run: python monitor_ndvi.py
      - name: Nível único
        run: python -m src.alerta
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recalibracao-final
          path: |
            docs/data
            data/climatologia_macrofitas.json
          retention-days: 7
